[project]
name = "temporal-run-task-sample"
version = "0.1.0"
description = "A Temporal workflow whose harness activity runs a task on the pi harness server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-api-unified[openai]",
    "httpx==0.28.1",
    "temporalio==1.34.0",
]

[tool.uv]
package = false

[tool.uv.sources]
ai-api-unified = { git = "https://github.com/davecthomas/ai-api-unified", rev = "ebf9d489cc02ad075dddd313e1146e5e2d9840fc" }

[tool.ruff]
line-length = 120
