# Deploys main to Google Cloud after every merge, once main's checks pass at that commit.
#
# A deploy is both Terraform stacks, in order. First the platform stack (deploy/terraform/platform): the
# network, the identities and their roles, the secrets' containers. It is applied only when its plan
# shows a change, and never when deploy/platform_guard.py refuses the plan. Then the release stack
# (deploy/terraform/release), which reads the platform's outputs: the edge image this workflow builds
# from the commit, and the commit itself, which the running VM is updated to in place. It signs in to
# Google Cloud as mh-deploy-sa through workload identity federation, which only this repo's main branch
# may use, so no key is stored here.
# Run it again from the Actions tab (Run workflow), or with make deploy.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A newer merge waits for the running deploy, and replaces any that is waiting.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  id-token: write
  issues: write

env:
  PROJECT: meta-harness-prod
  REGION: us-central1
  EDGE_IMAGE: us-central1-docker.pkg.dev/meta-harness-prod/mh/edge:${{ github.sha }}

jobs:
  deploy:
    name: deploy to Google Cloud
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: wait for main's checks to pass at this commit
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS: "control plane tests|console web app|zero-cost end-to-end check|harness server tests"
        run: |
          for i in $(seq 1 120); do
            runs=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv')
            failed=$(echo "$runs" | awk -F'\t' -v c="$CHECKS" '$1 ~ "^("c")$" && $2=="completed" && $3!="success"')
            if [ -n "$failed" ]; then
              echo "a check did not pass: $failed"
              # The failure issue names each failed check and links its run.
              gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100" \
                --jq '.check_runs[] | select(.status == "completed" and .conclusion != "success") | "- \(.name): \(.conclusion), \(.html_url)"' \
                | grep -E "^- (${CHECKS}):" >failed-checks.txt || true
              exit 1
            fi
            passed=$(echo "$runs" | awk -F'\t' -v c="$CHECKS" '$1 ~ "^("c")$" && $3=="success"' | cut -f1 | sort -u | wc -l)
            [ "$passed" -eq 4 ] && { echo "all four checks passed"; exit 0; }
            sleep 15
          done
          echo "the checks did not finish in 30 minutes" | tee failed-checks.txt
          exit 1
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/57473592166/locations/global/workloadIdentityPools/github/providers/github
          service_account: mh-deploy-sa@meta-harness-prod.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false
      - name: apply the platform stack when it changed
        id: platform
        working-directory: deploy/terraform/platform
        run: |
          # Init reads the state bucket; a passing Cloud Storage error is tried again, three times in all.
          for try in 1 2 3; do terraform init -input=false && break; [ "$try" = 3 ] && exit 1; sleep 20; done
          # Exit code 0: the cloud matches the stack. 2: the plan has changes. Anything else: the plan failed.
          # The plan reads the state from Cloud Storage too, which fails now and then: an error is tried again.
          for try in 1 2 3; do
            code=0
            terraform plan -input=false -detailed-exitcode -out=platform.tfplan || code=$?
            [ "$code" != 1 ] && break
            [ "$try" != 3 ] && sleep 20
          done
          case "$code" in
            0) echo "the platform stack matches the cloud: nothing to apply" ;;
            2)
              terraform show -json platform.tfplan | python3 "$GITHUB_WORKSPACE/deploy/platform_guard.py"
              terraform apply -input=false platform.tfplan
              ;;
            *) exit "$code" ;;
          esac
      - name: build the edge image and push it to Artifact Registry
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -f deploy/edge.Dockerfile -t "$EDGE_IMAGE" .
          docker push "$EDGE_IMAGE"
      - name: apply the release stack
        id: apply
        working-directory: deploy/terraform/release
        run: |
          # Init reads the state bucket; a passing Cloud Storage error is tried again, three times in all.
          for try in 1 2 3; do terraform init -input=false && break; [ "$try" = 3 ] && exit 1; sleep 20; done
          # No -replace: the VM keeps running, and only its metadata (the commit) changes. Terraform
          # replaces it only when its definition changed, and stops and starts it for a new machine type;
          # either way it boots the commit by itself. The plan says which: a VM change that deletes is a
          # replacement, and one that changes the machine type is a restart.
          for try in 1 2 3; do
            terraform plan -input=false -out=release.tfplan -var "commit=${{ github.sha }}" -var "edge_image=$EDGE_IMAGE" && break
            [ "$try" = 3 ] && exit 1
            sleep 20
          done
          vm='[.resource_changes[] | select(.address == "google_compute_instance.vm")]'
          deleted=$(terraform show -json release.tfplan | jq -r "$vm"' | [.[].change.actions[]] | index("delete") != null')
          resized=$(terraform show -json release.tfplan | jq -r "$vm"' | any(.[]; .change.before != null and .change.before.machine_type != .change.after.machine_type)')
          replaced=$([ "$deleted" = true ] || [ "$resized" = true ] && echo true || echo false)
          echo "replaced=$replaced" >> "$GITHUB_OUTPUT"
          echo "the VM is $([ "$deleted" = true ] && echo replaced || ([ "$resized" = true ] && echo "stopped, resized and started" || echo updated in place))"
          terraform apply -input=false release.tfplan
      - name: update the running VM in place
        if: steps.apply.outputs.replaced == 'false'
        run: |
          # The startup script, from the metadata the apply just set, run as its own unit so a dropped SSH
          # connection cannot stop it. It checks the commit out and restarts the services one at a time.
          timeout 1500 gcloud compute ssh mh-vm --zone "$REGION-a" --project "$PROJECT" --tunnel-through-iap --quiet \
            --command "sudo systemd-run --wait --collect --unit mh-update-${GITHUB_RUN_ID} --setenv=MH_DEPLOY_MODE=update --setenv=HOME=/root bash -c 'curl -fs -H Metadata-Flavor:Google http://metadata.google.internal/computeMetadata/v1/instance/attributes/startup-script > /run/mh-update.sh && bash /run/mh-update.sh'"
      - name: wait for the VM to boot the commit
        run: |
          for i in $(seq 1 120); do
            result=$(gcloud compute instances get-guest-attributes mh-vm --zone "$REGION-a" --project "$PROJECT" \
              --query-path mh/boot --format='value(value)' 2>/dev/null || true)
            case "$result" in
              "ok ${{ github.sha }}") echo "the VM runs ${{ github.sha }}"; exit 0 ;;
              "failed ${{ github.sha }}"*) echo "the VM's boot failed ($result); read /var/log/mh-boot.log over IAP SSH"; exit 1 ;;
            esac
            sleep 15
          done
          echo "the VM did not report in 30 minutes (last: ${result:-nothing})"
          exit 1
      - name: open an issue for the failed deploy
        # A failed deploy is work: the issue's label lets a goal pick it up and fix it.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${{ steps.checks.outcome }}" = "failure" ]; then
            # Nothing was deployed: main's checks failed at this commit, so the issue names them.
            gh issue create --repo "${{ github.repository }}" --label meta-harness:operations \
              --title "Deploy of ${GITHUB_SHA::7} blocked: a check failed on main" \
              --body "The deploy of ${{ github.sha }} did not start, because a check main must pass failed at that commit: $RUN_URL

          $(cat failed-checks.txt 2>/dev/null || echo "The failed check could not be read; see the run.")

          Nothing changed on Google Cloud. Fix the check on main, and the next merge deploys."
            exit 0
          fi
          result=$(gcloud compute instances get-guest-attributes mh-vm --zone "$REGION-a" --project "$PROJECT" \
            --query-path mh/boot --format='value(value)' 2>/dev/null || true)
          gh issue create --repo "${{ github.repository }}" --label meta-harness:operations \
            --title "Deploy of ${GITHUB_SHA::7} failed" \
            --body "The deploy of ${{ github.sha }} failed: $RUN_URL

          The platform stack step: ${{ steps.platform.outcome || 'not reached' }}. The release stack step: ${{ steps.apply.outcome || 'not reached' }}. A platform step that failed with \"refused\" lines met deploy/platform_guard.py: the change destroys something a deploy must keep.

          The VM reported: \`${result:-nothing}\`. A result ending in \"rolled back to <commit>\" means the VM runs that commit again and every service is healthy; the change in ${GITHUB_SHA::7} needs fixing before it can deploy. Its boot log is /var/log/mh-boot.log on mh-vm."
