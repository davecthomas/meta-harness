# The zero-cost end-to-end check and the harness server's tests, on every pull request.
#
# make e2e runs the whole current path (the RunTask workflow, the per-run sandbox
# behind the egress proxy, the harness server running pi) against a fake HTTP
# Gateway that makes no model calls, so it needs no provider keys and costs nothing.

name: zero-cost end-to-end check

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request replaces its running checks. On main each commit's checks are a group of
# their own, so they always run to the end: the deploy of a commit waits for them, and a run cancelled by
# the next merge read as a failed check, which stopped that deploy and opened an issue for a failure that
# never happened. (Queued in one group, a third merge would cancel the second's waiting run too.)
concurrency:
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Whether this change needs the two slow checks below (deploy/checks_scope.py says why and when). A pull
  # request that touches only the console's source or the docs skips them, so a task's review does not wait
  # four to six minutes for checks that cannot say anything about it. Every push to main runs them.
  scope:
    name: which checks this change needs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      slow: ${{ steps.scope.outputs.slow }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A pull request is checked out as its merge with its base: the base is the first parent.
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          slow=run
          if [ "$EVENT" = pull_request ]; then
            slow=$(git diff --name-only HEAD^1 HEAD | python3 deploy/checks_scope.py)
          fi
          echo "slow=$slow" >> "$GITHUB_OUTPUT"
          echo "the slow checks: $slow"

  e2e:
    name: zero-cost end-to-end check
    needs: scope
    # Only an explicit skip skips: if the scope job fails or is canceled, the check still runs.
    if: ${{ always() && needs.scope.outputs.slow != 'skip' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The task-api step runs the task service and event service on this Postgres.
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: mh
          POSTGRES_PASSWORD: mh
          POSTGRES_DB: mh
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready -U mh -d mh"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      MH_DATABASE_URL: postgresql://mh:mh@127.0.0.1:5444/mh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.5"

      - name: Install the Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh -s -- --version v1.10.0
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"

      - name: make e2e
        working-directory: samples/temporal-run-task
        env:
          # On Linux the egress proxy container reaches the fake through the Docker bridge, not 127.0.0.1.
          FAKE_GATEWAY_HOST: 0.0.0.0
        run: make e2e

      - name: Keep the logs of a failed check
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-logs
          path: |
            samples/temporal-run-task/e2e-logs/
            samples/temporal-run-task/*.log
            stack/*.log
            samples/temporal-run-task/runs/*/harness-server.log
          if-no-files-found: ignore

  # The checks a task on this repo runs, run by pi's bash tool in the built sandbox image, on a clone of this
  # checkout, behind the egress proxy, with a database beside it: what a task's agent meets. It fails when the
  # image or the sandbox cannot run them, as when the image set NODE_ENV=production (#187). No model is called.
  image-checks:
    name: sandbox runs this repo's checks
    needs: scope
    if: ${{ always() && needs.scope.outputs.slow != 'skip' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.5"

      - name: Install the Temporal CLI
        run: |
          curl -sSf https://temporal.download/cli.sh | sh -s -- --version v1.10.0
          echo "$HOME/.temporalio/bin" >> "$GITHUB_PATH"

      - name: make image-checks
        working-directory: samples/temporal-run-task
        env:
          FAKE_GATEWAY_HOST: 0.0.0.0
        run: make image-checks

      - name: Keep the logs of a failed check
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-checks-logs
          path: |
            samples/temporal-run-task/*.log
            samples/temporal-run-task/runs/*/harness-server.log
          if-no-files-found: ignore

  harness-server:
    name: harness server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: images/harness-pi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: images/harness-pi/.nvmrc
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
