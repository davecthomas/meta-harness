# The control plane's lint and tests, on every pull request, against a real Postgres.

name: control plane

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: control-plane-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: control plane tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: mh
          POSTGRES_PASSWORD: mh
          POSTGRES_DB: mh
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready -U mh -d mh"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      MH_DATABASE_URL: postgresql://mh:mh@127.0.0.1:5444/mh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: a pull request sets no version
        if: github.event_name == 'pull_request'
        run: python3 src/meta_harness/versioning.py --check "origin/${{ github.base_ref }}"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - run: make lint
      - run: uv run mh migrate
      - name: make test, with every database test required to run
        # The replay test's recording runs only when asked (MH_RECORD_HISTORIES); every other skip fails the job.
        run: uv run pytest -q -rs | tee pytest.out && ! grep "SKIPPED" pytest.out | grep -v "records histories only when asked"

  console:
    name: console web app
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
