# The control plane's lint and tests, on every pull request, against a real Postgres.

name: control plane

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request replaces its running checks. On main each commit's checks are a group of
# their own, so they always run to the end: the deploy of a commit waits for them, and a run cancelled by
# the next merge read as a failed check, which stopped that deploy and opened an issue for a failure that
# never happened. (Queued in one group, a third merge would cancel the second's waiting run too.)
concurrency:
  group: control-plane-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A pull request that touches only documentation runs neither job (deploy/checks_scope.py). Every push to main
  # runs both.
  scope:
    name: which control plane checks this change needs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # A pull request is checked out as its merge with its base: the base is the first parent.
          fetch-depth: 2
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          scope=run
          if [ "$EVENT" = pull_request ]; then
            scope=$(git diff --name-only HEAD^1 HEAD | python3 deploy/checks_scope.py)
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "the checks: $scope"

  test:
    name: control plane tests
    needs: scope
    # Only an explicit docs answer skips: if the scope job fails or is canceled, the check still runs.
    if: ${{ always() && needs.scope.outputs.scope != 'docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: mh
          POSTGRES_PASSWORD: mh
          POSTGRES_DB: mh
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready -U mh -d mh"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      MH_DATABASE_URL: postgresql://mh:mh@127.0.0.1:5444/mh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: a pull request sets no version
        if: github.event_name == 'pull_request'
        run: python3 src/meta_harness/versioning.py --check "origin/${{ github.base_ref }}"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - run: make lint
      - run: uv run mh migrate
      - name: make test, with every database test required to run
        # The replay test's recording runs only when asked (MH_RECORD_HISTORIES); every other skip fails the job.
        # Across the runner's cores, each worker on a database of its own (tests/conftest.py): the suite took
        # four and a half minutes on one core, and that was the longest check on every pull request.
        run: uv run pytest -q -rs -n auto | tee pytest.out && ! grep "SKIPPED" pytest.out | grep -v "records histories only when asked"

  # What a pull request adds that no test or type check covers, said to its reviewer, and it holds nothing: the
  # tests' own job says whether they pass. The changed lines no test runs are posted as one comment on the pull
  # request, which a Muxxy review reads (docs/specs/work-with-repo-ci.md). A type error fails this job only when
  # the change adds it (deploy/type_ratchet.py): the repo has several hundred from before it was checked.
  quality:
    name: what this change adds unchecked
    needs: scope
    if: ${{ github.event_name == 'pull_request' && needs.scope.outputs.scope != 'docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: mh
          POSTGRES_PASSWORD: mh
          POSTGRES_DB: mh
        ports:
          - 5444:5432
        options: >-
          --health-cmd "pg_isready -U mh -d mh"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      MH_DATABASE_URL: postgresql://mh:mh@127.0.0.1:5444/mh
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.5"
      - run: uv sync --locked
      - name: type errors this change adds
        run: |
          git worktree add --quiet /tmp/base "$BASE"
          uvx pyright@1.1.407 /tmp/base/src --pythonpath .venv/bin/python --outputjson > /tmp/base.json || true
          uvx pyright@1.1.407 src --pythonpath .venv/bin/python --outputjson > /tmp/head.json || true
          python3 deploy/type_ratchet.py /tmp/base.json /tmp/head.json --strip /tmp/base/ | tee -a "$GITHUB_STEP_SUMMARY"
      - run: uv run mh migrate
        if: always()
      - name: changed lines no test runs
        if: always()
        # The tests' own job says whether they pass: here they only say which lines they ran.
        run: |
          uv run pytest -q -n auto --cov=src/meta_harness --cov-report=xml:coverage.xml || true
          uvx diff-cover@11.0.5 coverage.xml --compare-branch "$BASE" --format markdown:coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: say them on the pull request
        if: always()
        # One comment, kept up to date, found by its first line. A pull request from a fork has a token that
        # cannot comment: the report is still in the job's summary.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          { echo "<!-- changed-lines-coverage -->"; cat coverage.md; } > comment.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate -q '.[] | select(.body | startswith("<!-- changed-lines-coverage -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md -q .html_url
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md -q .html_url
          fi

  console:
    name: console web app
    needs: scope
    if: ${{ always() && needs.scope.outputs.scope != 'docs' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
