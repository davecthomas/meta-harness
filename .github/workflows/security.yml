# What the repo's dependencies and code are known to be open to, kept out of every pull request's wait.
#
# The dependency audit runs on a pull request only when it changes what is installed (a lock file or a project
# file), so a vulnerable package is refused where it comes in. Everything here also runs each night and on
# demand, since an advisory is published against code that has not changed: a night's failure is the repo's to
# fix, and it holds no unrelated pull request. CodeQL and the sandbox image's scan report to the repo's code
# scanning alerts (docs/specs/work-with-repo-ci.md).

name: security

on:
  pull_request:
    paths:
      - uv.lock
      - pyproject.toml
      - "**/package-lock.json"
      - "**/package.json"
      - .github/workflows/security.yml
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.5"
      - name: Python packages with a known vulnerability
        run: |
          uv export --locked --no-hashes --no-emit-project --format requirements-txt -q > requirements.audit.txt
          uvx pip-audit==2.10.1 -r requirements.audit.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: The console's packages with a high or critical vulnerability
        working-directory: console
        run: npm audit --audit-level=high
      - name: The harness server's packages with a high or critical vulnerability
        working-directory: images/harness-pi
        run: npm audit --audit-level=high

  codeql:
    name: code scanning (${{ matrix.language }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}

  image:
    name: sandbox image scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the per-run sandbox image
        run: docker build --tag harness-pi:scan images/harness-pi
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: harness-pi:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        if: always()
        with:
          sarif_file: trivy.sarif
          category: sandbox-image
