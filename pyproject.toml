[project]
name = "meta-harness"
version = "0.38.2"
description = "The meta-harness control plane: task service, planner, run service, event service and operator console"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-api-unified[openai]",
    "click==8.1.8",
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "jsonschema==4.23.0",
    "psycopg-pool==3.2.6",
    "psycopg[binary]==3.2.9",
    "pyjwt[crypto]==2.10.1",
    "python-multipart==0.0.20",
    "temporalio==1.34.0",
    "uvicorn==0.34.3",
]

[project.scripts]
mh = "meta_harness.cli:main"

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "pytest-timeout==2.3.1",
    "ruff==0.11.13",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meta_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A hung test fails with a traceback instead of stalling the run.
timeout = 120
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: needs Postgres at MH_DATABASE_URL (make up starts one)",
]

[tool.ruff]
line-length = 120
extend-exclude = ["samples", "images"]

[tool.uv.sources]
ai-api-unified = { git = "https://github.com/davecthomas/ai-api-unified", rev = "ebf9d489cc02ad075dddd313e1146e5e2d9840fc" }
