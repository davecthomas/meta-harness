[project]
name = "meta-harness"
version = "0.49.0"
description = "The meta-harness control plane: task service, planner, run service, event service and operator console"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-api-unified[openai]",
    "click==8.5.1",
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.9",
    "pyjwt[crypto]==2.15.1",
    "python-multipart==0.0.34",
    # Pinned itself, not left to FastAPI: 0.39.0 to 0.49.0 answer a crafted Range header with unbounded work
    # (CVE-2025-62727), and the edge serves files to anyone.
    "starlette==1.10.0",
    "temporalio==1.37.0",
    "uvicorn==0.54.0",
]

[project.scripts]
mh = "meta_harness.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.6",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meta_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A hung test fails with a traceback instead of stalling the run.
timeout = 120
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "db: needs Postgres at MH_DATABASE_URL (make up starts one)",
]

[tool.ruff]
line-length = 120
# Shipped skills (config/skills) keep their source's code exactly as it is.
extend-exclude = ["samples", "images", "config/skills"]

[tool.uv.sources]
ai-api-unified = { git = "https://github.com/davecthomas/ai-api-unified", rev = "06bdc45970eb9055a622df1a2c7e48174f267ffa" }
